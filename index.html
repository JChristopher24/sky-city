<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>Sky City</title>
  </head>
  <body class="flex flex-col h-screen p-5 gap-4">
    <header class="font-bold italic text-5xl text-center rounded-4xl p-4">
      <h1>Sky City</h1>
    </header>

    <main class="flex flex-1 gap-4">
      <div class="flex justify-center items-center flex-col p-5 text-white bg-black/75 rounded-4xl border-gray-600 border-2 shadow-2xl">
        <!-- clicker area -->
        <p id="scoreDisplay" class="mb-10 text-5xl">Score</p>
        <button id="clicker" class="active:scale-95 transition-transform">
          <img src="src/assets/sky.png" alt="Sky City" class="max-w-sm">
        </button>
      </div>

      <div class="bg-indigo-500 flex-1 flex flex-col text-white rounded-4xl border-gray-600 border-2 shadow-2xl p-4 gap-4">
        <!-- store area -->
         <h1 class="text-5xl text-center">Store</h1>
        <section class="flex flex-wrap justify-center gap-4">

          <!-- Construction Speed Button -->
          <button id="upgradeOne" class="flex transition-all bg-mauve-400 items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl">
            <img class="h-35 invert" src="/src/assets/cl.png" alt="">
            <div class="p-4">
              <p id="upgradeOneCount"> -0% Speed</p>
              <p>Cost: $50</p> 
            </div>
          </button>

         <!-- Construction Cost Button --> 
          <button id="upgradeTwo" class="flex transition-all bg-mauve-400 items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl">
            <img class="h-35 invert" src="/src/assets/cc.png" alt="">
            <div class="p-4">
              <p id="upgradeTwoCount"> -0% Cost </p>
              <p>Cost: $100</p>
            </div>
          </button>

          <!-- Construction Quality Button --> 
          <button id="upgCqu" class="flex transition-all bg-mauve-400 items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl">
            <img class="h-35" src="/src/assets/cq.png" alt="">
            Construction Quality
            <div class="p-4">
              <p id="upgCquCount"> +0% Quality </p>
              <p>Cost: $1000</p>
            </div>
          </button>

          <!-- Profit Per Building Button --> 
          <button id="upgPpb" class="flex transition-all bg-mauve-400 items-center text-lg p-4 border active:scale-105 border-gray-700 active:bg-gray-800 rounded-2xl">
            <img class="h-35" src="/src/assets/ppb.png" alt="">
            Profit Per Building
            <div class="p-4">
              <p id="upgPpbCount"> +0% Profit </p>
              <p>Cost: $5000</p>
            </div>
          </button>

        </section>
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
