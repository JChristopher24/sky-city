<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>Sky City</title>
  </head>
  <body class="flex flex-col h-screen">
    <header class="bg-sky-500 text-white italic text-5xl text-center p-2">
      <h1>Sky City</h1>
    </header>

    <main class="flex flex-1">
      <div class="bg-gray-500 flex-1">
        <!-- clicker area -->
        <button id="clicker" class="active:scale-95 w-full h-full text-3xl">
          <p id="scoreDisplay">Score</p>
          <img src="src/assets/sky.png" alt="Sky City" class="w-1/2 mx-auto">
        </button>
      </div>

      <div class="bg-indigo-500 flex-1">
        <!-- store area -->
         <h1 class="text-center text-4xl">Store</h1>
        <div class="">
          <button id="upgradeOne" class="bg-white border border-black">
            <img class="h-50" src="/src/assets/cl.png" alt="">
            <p id="upgradeOneCount"> 0 Construction Speed</p>
            <p>Cost: 100$</p> 
            
          </button>
          <button id="upgradeTwo" class="bg-white border border-black">
            <img class="h-50" src="/src/assets/cc.png" alt="">
            <p id="upgradeTwoCount"> 0 Construction Cost </p>
            <p>Cost: 1000$</p> 
          </button>
          <button id="cqu" class="bg-white border border-black">
            <img class="h-50" src="/src/assets/cq.png" alt="">
            Construction Quality
          </button>
          <button id="ppb" class="bg-white border border-black">
            <img class="h-50" src="/src/assets/ppb.png" alt="">
            Profit Per Building
          </button>

        </div>
      
      </div>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
